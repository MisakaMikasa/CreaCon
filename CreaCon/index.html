<!DOCTYPE html>
<html>
<head>
    <script src="main.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A status light, deliberately. The interface is CreaCon.exe; this panel
       only reports whether Photoshop is reachable from it. Anything added here
       is something every user has to reinstall the plugin for. -->
  <div id="panel">
    <div id="status"><span id="dot" class="dot bad"></span><span id="statusText">Connecting…</span></div>
    <p class="hint">
      Open the CreaCon app to edit. This plugin runs the edits it sends.
    </p>
  </div>
</body>
</html>
